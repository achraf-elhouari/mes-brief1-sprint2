<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le panier du goûter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">YOUCODE · MISE EN SITUATION JAVASCRIPT</p>
        <h1>Le panier du goûter</h1>
        <p>Préparez les achats pour la pause du groupe.</p>
      </header>

      <section class="panel" aria-labelledby="titre-ajout">
        <h2 id="titre-ajout">Ajouter un produit</h2>
        <form id="form-produit" novalidate>
          <div>
            <label for="nom">Nom du produit</label
            ><input
              id="nom"
              name="nom"
              type="text"
              placeholder="Ex. Jus d’orange"
              required
            />
          </div>
          <div>
            <label for="prix">Prix (MAD)</label
            ><input
              id="prix"
              name="prix"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="Ex. 12"
              required
            />
          </div>
          <button type="submit">Ajouter au panier</button>
        </form>
        <p id="message" class="message" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="titre-panier">
        <div class="section-heading">
          <h2 id="titre-panier">Mon panier</h2>
          <span><span id="compteur">0</span> produit(s)</span>
        </div>
        <ul id="liste-produits" class="liste"></ul>
        <p id="etat-vide" class="empty">Votre panier est vide.</p>
        <p class="total">
          Total <strong><span id="total">0.00</span> MAD</strong>
        </p>
      </section>
    </main>

    <!-- Modèle fourni : créer les éléments avec createElement(). -->
    <template id="modele-produit">
      <li class="produit">
        <div>
          <strong class="nom-produit"></strong
          ><span class="prix-produit"></span>
        </div>
        <button class="supprimer" type="button">Retirer</button>
      </li>
    </template>
  </body>
</html>
